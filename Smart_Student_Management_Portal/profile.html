<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Student Portal</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="logo">🎓 <span>Student Portal</span></div>
<nav><a href="dashboard.html">🏠 Dashboard</a><a class="active" href="profile.html">👤 Profile</a><a href="attendance.html">📅 Attendance</a><a href="marks.html">📊 Marks</a><a href="timetable.html">🕒 Timetable</a><a href="assignments.html">📚 Assignments</a>
      <a href="notices.html">📢 Notices</a>
      <a href="id-card.html">🪪 ID Card</a></nav>
<button class="logout" onclick="logout()">↪ Logout</button></aside>
<main class="main"><header class="topbar"><button class="menu-btn" onclick="toggleSidebar()">☰</button><div><h2>Student Profile</h2><span class="muted">Manage your details</span></div><div class="user-chip">👤 <span id="navName">Student</span></div></header>
<div class="card profile-card"><div class="profile-avatar"><img id="profilePhoto" src="images/profile.jpg" alt="Rohit Student Profile Picture"><span id="photoPlaceholder">📷</span></div>
<div class="photo-actions">
<label class="btn secondary" for="photoInput">📷 Choose Profile Photo</label>
<input id="photoInput" type="file" accept="image/*" hidden>
<button class="btn danger" type="button" id="removePhoto">Remove Photo</button>
</div>
<h2 id="profileHeading">Student</h2><p class="muted">Diploma in Computer Science</p>
<form id="profileForm" class="form-grid">
<label>Full Name<input id="name" required></label><label>Roll Number<input id="roll" required></label>
<label>Email<input id="profileEmail" type="email" required></label><label>Phone<input id="phone"></label>
<label>College<input id="college"></label><label>Semester<input id="semester"></label>
<label class="span-2">Address<textarea id="address" rows="3"></textarea></label>
<div class="span-2"><button class="btn primary" type="submit">Save Profile</button><span id="saveMsg" class="success-msg"></span></div>
</form></div></main></div>
<script src="js/app.js"></script><script src="js/profile.js"></script>
</body></html>
